name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLo "/tmp/${archive}" "${base}/${archive}"
          curl -fsSLo /tmp/gitleaks_checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          cd /tmp
          grep "  ${archive}$" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan full Git history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
